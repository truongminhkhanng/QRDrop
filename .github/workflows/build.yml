name: Build QRDrop installers
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Resolve npm lockfile for matched Tauri API (bootstrap only)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Preserve npm lockfile in build log
        run: python -c "import base64,pathlib,zlib; data=base64.b64encode(zlib.compress(pathlib.Path('package-lock.json').read_bytes())).decode(); print('QRDROP_NPM_LOCK_BEGIN'); print('\n'.join(data[i:i+200] for i in range(0,len(data),200))); print('QRDROP_NPM_LOCK_END')"
      - run: npm ci
      - run: npm run build
      - run: npm run test:hash
      - run: npm run test:codeintel
      - run: npm run test:mobile
      - name: Resolve Rust lockfile (initial bootstrap only)
        shell: bash
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi
      - name: Preserve Rust lockfile in build log
        run: python -c "import base64,pathlib,zlib; data=base64.b64encode(zlib.compress(pathlib.Path('src-tauri/Cargo.lock').read_bytes())).decode(); print('QRDROP_LOCK_BEGIN'); print('\n'.join(data[i:i+200] for i in range(0,len(data),200))); print('QRDROP_LOCK_END')"
      - name: Test real receiver
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Check desktop source
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Build native installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
        env:
          # Test builds only. Configure Developer ID + notarization before public macOS distribution.
          APPLE_SIGNING_IDENTITY: '-'
      - name: Upload installers
        if: github.event_name == 'pull_request' || github.event.repository.private != true
        uses: actions/upload-artifact@v4
        with:
          name: qrdrop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
      - name: Save private test installers in draft release
        if: github.event_name != 'pull_request' && github.event.repository.private == true
        env:
          GH_TOKEN: ${{ github.token }}
          QRDROP_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('test-{0}-{1}', github.run_id, github.run_attempt) }}
          QRDROP_REPO: ${{ github.repository }}
          QRDROP_TARGET: ${{ github.sha }}
          QRDROP_BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(find "src-tauri/target/$QRDROP_BUILD_TARGET/release/bundle" -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          test "${#files[@]}" -gt 0
          if ! gh release view "$QRDROP_TAG" --repo "$QRDROP_REPO" >/dev/null 2>&1; then
            if ! gh release create "$QRDROP_TAG" --repo "$QRDROP_REPO" --target "$QRDROP_TARGET" --draft --title "QRDrop test build $QRDROP_TAG" --notes "Installers for testing on real devices. See docs/TESTING.md. Windows publisher signing and macOS production signing/notarization are not configured. This draft is never published automatically."; then
              gh release view "$QRDROP_TAG" --repo "$QRDROP_REPO" >/dev/null
            fi
          fi
          test "$(gh release view "$QRDROP_TAG" --repo "$QRDROP_REPO" --json isDraft --jq '.isDraft')" = true
          gh release upload "$QRDROP_TAG" "${files[@]}" --repo "$QRDROP_REPO"
