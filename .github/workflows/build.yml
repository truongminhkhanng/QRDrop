name: Build QRDrop installers
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm run test:hash
      - run: npm run test:codeintel
      - run: npm run test:mobile
      - name: Resolve Rust lockfile (initial bootstrap only)
        shell: bash
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi
      - name: Test real receiver
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Check desktop source
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Build native installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
        env:
          # Test builds only. Configure Developer ID + notarization before public macOS distribution.
          APPLE_SIGNING_IDENTITY: '-'
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: qrdrop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
      - name: Upload resolved Rust lockfile
        uses: actions/upload-artifact@v4
        with:
          name: qrdrop-rust-lock-${{ matrix.artifact }}
          if-no-files-found: error
          path: src-tauri/Cargo.lock

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qrdrop-*
          path: installers
      - name: Prepare draft release (never publish automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          QRDROP_TAG: ${{ github.ref_name }}
          QRDROP_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -d '' files < <(find installers -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          gh release create "$QRDROP_TAG" "${files[@]}" --repo "$QRDROP_REPO" --draft --title "QRDrop $QRDROP_TAG" --notes "Test installers. See the project testing guide. macOS builds are ad-hoc signed; production signing/notarization is not configured."
