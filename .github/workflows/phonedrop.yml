name: Test and build PhoneDrop

on:
  push:
    branches: [main, feature/phonedrop, 'release/phonedrop-v*']
    paths:
      - 'phonedrop/**'
      - '.github/workflows/phonedrop.yml'
    tags: ['phonedrop-v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: phonedrop

jobs:
  test:
    name: Python 3.12 tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: phonedrop/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - name: Run all tests, including real HTTP and HTTPS
        run: python -m pytest -q
      - name: Validate mobile JavaScript syntax and UI flows
        run: |
          python tools/check_mobile.py
          node --test tests/mobile-ui.test.cjs

  build:
    name: Build and run Windows executable
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: phonedrop/requirements.txt
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name PhoneDrop app.py
      - name: Run packaged Tk, QR, TLS and HTTP upload smoke test
        shell: pwsh
        run: |
          $resultPath = Join-Path $pwd 'smoke-result.json'
          $process = Start-Process -FilePath '.\dist\PhoneDrop.exe' -ArgumentList @('--self-test', "`"$resultPath`"") -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
          if (-not (Test-Path $resultPath)) { throw 'Missing smoke test result' }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not ($result.ok -and $result.tk -and $result.qr -and $result.tls -and $result.desktop_ui -and $result.http_upload)) {
            throw 'Incomplete packaged smoke test'
          }
          $exe = Get-Item 'dist/PhoneDrop.exe'
          if ($exe.Length -lt 5MB -or $exe.Length -gt 250MB) { throw 'Unexpected executable size' }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows executable header' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  PhoneDrop.exe" | Set-Content -Encoding ascii 'dist/PhoneDrop.exe.sha256'
          Write-Output "Verified PhoneDrop.exe: $($exe.Length) bytes"
          Write-Output "SHA-256: $hash"
          Get-Content $resultPath -Raw
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneDrop-Windows
          path: |
            phonedrop/dist/PhoneDrop.exe
            phonedrop/dist/PhoneDrop.exe.sha256
            phonedrop/smoke-result.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release tagged executable
    if: startsWith(github.ref, 'refs/tags/phonedrop-v') || startsWith(github.ref, 'refs/heads/release/phonedrop-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: phonedrop-official-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require a new version for this update
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_version.py
      - uses: actions/download-artifact@v4
        with:
          name: PhoneDrop-Windows
          path: artifact
      - name: Verify downloaded executable before publishing
        working-directory: .
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          artifact = Path('artifact')
          exe = artifact / 'dist/PhoneDrop.exe'
          data = exe.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          expected = (artifact / 'dist/PhoneDrop.exe.sha256').read_text().split()[0]
          result = json.loads((artifact / 'smoke-result.json').read_text())
          assert data[:2] == b'MZ' and 5 * 1024**2 <= len(data) <= 250 * 1024**2
          assert digest == expected
          assert all(result.get(key) is True for key in ('ok', 'tk', 'qr', 'tls', 'desktop_ui', 'http_upload'))
          print(f'PhoneDrop.exe: {len(data)} bytes; SHA-256 {digest}')
          print(json.dumps(result))
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PhoneDrop ${{ steps.version.outputs.version }}
          make_latest: true
          draft: false
          prerelease: false
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            ## PhoneDrop ${{ steps.version.outputs.version }} — Windows 64-bit

            Tải PhoneDrop.exe, mở trên máy tính, quét QR bằng điện thoại cùng mạng Wi-Fi/LAN và bấm Cho phép trên PC. Không cần cài Python. Máy tính dùng Ethernet vẫn được nếu điện thoại truy cập được cùng mạng nội bộ.

            - Giao diện tiếng Việt, nền tối; chọn nhiều file, xem tiến trình và kết quả từng file.
            - Phiên nhận tối đa 12 giờ; bấm Ngắt kết nối bất cứ lúc nào. File hoàn tất được giữ lại, file dở bị hủy.
            - Tối đa 5 GiB/file, gửi tuần tự, không ghi đè file cũ. QR dùng một lần; PC phải duyệt trước khi nhận.
            - Cài đặt IP, thư mục nhận và HTTPS với chứng chỉ tự ký; không cần cấu hình router.

            Kiểm chứng tự động: test Python và mobile JavaScript trên Windows/Linux, gồm HTTP/HTTPS thật. Chính EXE đã chạy smoke test giao diện Tkinter, QR, duyệt, tiến trình, bố cục hẹp, ngắt phiên và nhận file HTTP trên Windows. Artifact tải lại được kiểm tra MZ và SHA-256 trước khi phát hành. Chi tiết lần kiểm tra: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Đây là ứng dụng LAN, chưa gửi qua Internet/4G khác mạng. HTTP mặc định không mã hóa; chỉ dùng mạng tin cậy. EXE chưa ký nhà phát hành. Kiểm thử điện thoại thật, DPI và đợt 500 file/~5 GB vẫn cần nghiệm thu; test hiện có dùng file nhỏ và thời gian mô phỏng. Chưa hỗ trợ tiếp tục file đang gửi dở.

            Đối chiếu checksum: Get-FileHash .\PhoneDrop.exe -Algorithm SHA256 với PhoneDrop.exe.sha256 đi kèm.
          files: |
            artifact/dist/PhoneDrop.exe
            artifact/dist/PhoneDrop.exe.sha256
