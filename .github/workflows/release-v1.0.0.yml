name: Publish QRDrop v1.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.0.0.yml']
  workflow_run:
    workflows: ['Build QRDrop installers']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: qrdrop-release-v1.0.0
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'truongminhkhanng/QRDrop' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.id == 37482136952 &&
      github.event.workflow_run.head_sha == '523b49acfec366390313bfedfda42992f05a5c01' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check the exact native build
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 37482136952 });
            if (run.head_sha !== '523b49acfec366390313bfedfda42992f05a5c01' || run.head_branch !== 'main' || run.event !== 'push') throw new Error('Unexpected build source');
            if (run.status !== 'completed') {
              core.info('Native build is still running; publication waits for its completion event.');
              core.setOutput('ready', 'false');
              return;
            }
            if (run.conclusion !== 'success') throw new Error('Native build failed');
            core.setOutput('ready', 'true');
      - uses: actions/checkout@v4
        if: steps.build.outputs.ready == 'true'
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        if: steps.build.outputs.ready == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Refresh the derived source index
        if: steps.build.outputs.ready == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run codeintel -- update
          npm run codeintel -- status
          python3 - <<'PYINDEX'
          from pathlib import Path
          import base64, gzip, json, hashlib
          files = {name: base64.b64encode(Path(name).read_bytes()).decode() for name in ['.agent/codegraph.sqlite', '.agent/codegraph-state.json']}
          data = gzip.compress(json.dumps(files).encode(), mtime=0)
          print('QRDROP_INDEX_SHA256=' + hashlib.sha256(data).hexdigest())
          encoded = base64.b64encode(data).decode()
          for offset in range(0, len(encoded), 4096):
              print('QRDROP_INDEX_DATA=' + encoded[offset:offset+4096])
          PYINDEX
      - name: Create and publish the new release
        if: steps.build.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const { execFileSync } = require('node:child_process');
            const repo = context.repo;
            const fullRepo = `${repo.owner}/${repo.repo}`;
            const SOURCE = '523b49acfec366390313bfedfda42992f05a5c01';
            const RUN_ID = 37482136952;
            const TARGET = context.sha;
            const TAG = 'v1.0.0';
            const expected = ['QRDrop_1.0.0_x64-setup.exe', 'QRDrop_1.0.0_aarch64.dmg', 'QRDrop_1.0.0_amd64.AppImage', 'QRDrop_1.0.0_amd64.deb'];
            const check = (ok, message) => { if (!ok) throw new Error(message); };
            const { data: metadata } = await github.rest.repos.get(repo);
            check(metadata.private, 'Repository must remain private');
            const sourceTree = (await github.rest.git.getTree({ ...repo, tree_sha: SOURCE, recursive: 'true' })).data;
            const targetTree = (await github.rest.git.getTree({ ...repo, tree_sha: TARGET, recursive: 'true' })).data;
            check(!sourceTree.truncated && !targetTree.truncated, 'Incomplete source tree');
            const protectedBlobs = tree => new Map(tree.tree.filter(item => item.type === 'blob' && !item.path.endsWith('.md') && item.path !== '.github/workflows/release-v1.0.0.yml').map(item => [item.path, `${item.mode}:${item.sha}`]));
            const tested = protectedBlobs(sourceTree), shipped = protectedBlobs(targetTree);
            check(tested.size === shipped.size && [...tested].every(([name, sha]) => shipped.get(name) === sha), 'Application/config/locks differ from tested source');
            const { data: main } = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
            check(main.commit.sha === TARGET, 'Publication commit must still be main head');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: RUN_ID });
            check(run.head_sha === SOURCE && run.status === 'completed' && run.conclusion === 'success' && run.head_branch === 'main' && run.event === 'push', 'Exact native build must succeed');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...repo, run_id: RUN_ID, filter: 'latest', per_page: 100 });
            check(jobs.length === 3 && jobs.every(job => job.status === 'completed' && job.conclusion === 'success'), 'All three native jobs must succeed');
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            const sourceRelease = releases.find(item => item.tag_name === `test-${RUN_ID}-${run.run_attempt}`);
            check(sourceRelease && sourceRelease.draft && sourceRelease.target_commitish === SOURCE, 'Verified test installers missing');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: sourceRelease.id, per_page: 100 });
            check(assets.length === 4 && expected.every(name => assets.filter(item => item.name === name).length === 1), 'Installer set incomplete');
            check(assets.every(item => item.state === 'uploaded' && item.size > 0 && /^sha256:[0-9a-f]{64}$/.test(item.digest || '')), 'Invalid installer metadata');
            const { data: notesFile } = await github.rest.repos.getContent({ ...repo, path: 'docs/RELEASE_v1.0.0.md', ref: TARGET });
            check(notesFile.type === 'file', 'Release notes missing');
            const notes = Buffer.from(notesFile.content, 'base64').toString('utf8');
            const rows = expected.map(name => { const item = assets.find(asset => asset.name === name); return `| ${name} | ${item.size} | \`${item.digest.slice(7)}\` |`; });
            const body = notes + `\nSource ứng dụng đã kiểm thử: \`${SOURCE}\`. Tag phát hành: \`${TARGET}\` (cùng mã ứng dụng và lockfile). [Kiểm thử và build](${run.html_url}).\n\n## Mã kiểm tra SHA-256\n\n| Bộ cài | Bytes | SHA-256 |\n|---|---:|---|\n` + rows.join('\n') + '\n';
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'qrdrop-v1-release-'));
            try {
              // Download only on the GitHub runner, then verify the actual bytes.
              execFileSync('gh', ['release', 'download', sourceRelease.tag_name, '--repo', fullRepo, '--dir', directory], { stdio: 'inherit' });
              for (const asset of assets) {
                const file = path.join(directory, asset.name);
                check(fs.statSync(file).size === asset.size, `Wrong file size: ${asset.name}`);
                const hash = crypto.createHash('sha256');
                for await (const chunk of fs.createReadStream(file)) hash.update(chunk);
                check(`sha256:${hash.digest('hex')}` === asset.digest, `Wrong file digest: ${asset.name}`);
              }
              let tag;
              try { tag = (await github.rest.git.getRef({ ...repo, ref: `tags/${TAG}` })).data; }
              catch (error) { if (error.status !== 404) throw error; }
              if (tag) check(tag.object.type === 'commit' && tag.object.sha === TARGET, 'Existing tag belongs to another source');
              else await github.rest.git.createRef({ ...repo, ref: `refs/tags/${TAG}`, sha: TARGET });
              let release = releases.find(item => item.tag_name === TAG);
              if (release) {
                check(release.target_commitish === TARGET && release.body === body && !release.prerelease, 'Existing release differs from this publication');
              } else {
                // Create a separate version release; retain the test draft as evidence.
                release = (await github.rest.repos.createRelease({ ...repo, tag_name: TAG, target_commitish: TARGET, name: 'QRDrop 1.0.0', body, draft: true, prerelease: false })).data;
              }
              const before = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: release.id, per_page: 100 });
              check(before.every(item => assets.some(asset => item.name === asset.name && item.digest === asset.digest && item.size === asset.size && item.state === 'uploaded')), 'Existing version assets differ');
              const missing = expected.filter(name => !before.some(item => item.name === name));
              if (missing.length) {
                check(release.draft, 'Never modify an already published release');
                execFileSync('gh', ['release', 'upload', TAG, ...missing.map(name => path.join(directory, name)), '--repo', fullRepo], { stdio: 'inherit' });
              }
              const uploaded = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: release.id, per_page: 100 });
              check(uploaded.length === 4 && assets.every(asset => uploaded.filter(item => item.name === asset.name && item.size === asset.size && item.digest === asset.digest && item.state === 'uploaded').length === 1), 'Uploaded installers must match verified bytes');
              if (release.draft) release = (await github.rest.repos.updateRelease({ ...repo, release_id: release.id, draft: false, prerelease: false, make_latest: 'true' })).data;
              check(!release.draft && !release.prerelease && release.tag_name === TAG && release.published_at, 'Stable publication failed');
              core.info(`Published ${release.html_url}; release_id=${release.id}`);
              await core.summary.addHeading('QRDrop 1.0.0 published').addLink('Download installers', release.html_url).addTable([['Installer', 'Bytes', 'SHA-256'], ...expected.map(name => { const asset = assets.find(item => item.name === name); return [name, String(asset.size), asset.digest]; })]).write();
            } finally {
              fs.rmSync(directory, { recursive: true, force: true });
            }
